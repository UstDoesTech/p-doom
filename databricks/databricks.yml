# Owns the Unity Catalog schema and its grants. Tables and views are created by
# `python -m pdoom.setup_db` because metric views cannot take bundle variables.
bundle:
  name: p-doom

variables:
  catalog:
    description: Existing catalog that will hold the schema
    default: workspace
  schema:
    default: pdoom
  app_principal:
    description: Application ID of the service principal that creates the tables (the CI identity)
  warehouse_id:
    description: SQL warehouse the app queries
    default: ""
  app_name:
    description: Databricks App name (workspace-global, 30 characters at most)
    default: pdoom
  app_source:
    description: Directory built by scripts/build_app.sh
    default: ../build/app

targets:
  dev:
    default: true

resources:
  schemas:
    pdoom:
      name: ${var.schema}
      catalog_name: ${var.catalog}
      comment: Doom telemetry for the p(doom) project
      grants:
        - principal: ${var.app_principal}
          privileges:
            - USE_SCHEMA
            - CREATE_TABLE
            - SELECT
            - MODIFY
        - principal: ${resources.apps.pdoom.service_principal_client_id}
          privileges:
            - USE_SCHEMA
            - SELECT
            - MODIFY
  apps:
    pdoom:
      name: ${var.app_name}
      description: Play Doom as many kinds of player and record p(doom) in Databricks
      source_code_path: ${var.app_source}
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
# The app's service principal also needs USE CATALOG on the catalog, which a bundle in this
# schema cannot grant:   GRANT USE CATALOG ON CATALOG workspace TO `<application id>`;
