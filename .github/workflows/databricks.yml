# Databricks side of the deploy. Needs repo secrets DATABRICKS_HOST, DATABRICKS_CLIENT_ID and
# DATABRICKS_CLIENT_SECRET (service principal, OAuth M2M).
#   check:  read-only. Proves auth works and lists catalogs and warehouses.
# Deploying lives in app.yml, because the bundle now includes the app.
name: databricks
on:
  workflow_dispatch:
    inputs:
      catalog:
        description: Existing catalog that will hold the schema
        default: workspace
      schema:
        default: pdoom
  push:
    branches: [ci/databricks-deploy]
    paths: [.github/workflows/databricks.yml]

permissions:
  contents: read

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks --version
      - name: Who am I
        run: |
          out=$(databricks current-user me -o json | jq -r '"\(.userName) active=\(.active)"')
          echo "::notice title=identity::${out}"
      - name: Catalogs
        run: |
          out=$(databricks catalogs list -o json | jq -r '.[].name' | paste -sd, -)
          echo "::notice title=catalogs::${out}"
      - name: Warehouses
        run: |
          out=$(databricks warehouses list -o json | jq -r '.[] | "\(.id) \(.name) \(.state) \(.warehouse_type)"' | paste -sd';' -)
          echo "::notice title=warehouses::${out}"
      - name: Bundle validate
        working-directory: databricks
        run: |
          mkdir -p ../build/app
          databricks bundle validate \
            --var="warehouse_id=4f084f656bc73157" \
            --var="catalog=${{ inputs.catalog || 'workspace' }}" \
            --var="schema=${{ inputs.schema || 'pdoom' }}" \
            --var="app_principal=${DATABRICKS_CLIENT_ID}"
