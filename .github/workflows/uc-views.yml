# Creates the Unity Catalog views and metric view over the Lakebase catalog, then queries them.
name: uc-views
on:
  workflow_dispatch:
  push:
    branches: [feat/genie-on-lakebase]
    paths: [.github/workflows/uc-views.yml, databricks/sql/**, backend/src/pdoom/setup_db.py]
permissions:
  contents: read
env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  WAREHOUSE: 4f084f656bc73157
jobs:
  views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Create the views
        working-directory: backend
        env:
          PDOOM_WAREHOUSE_ID: ${{ env.WAREHOUSE }}
          PDOOM_UC_CATALOG: workspace
          PDOOM_UC_SCHEMA: pdoom
          PDOOM_UC_LAKEBASE_CATALOG: pdoom_lakebase
        run: |
          pip install -q .
          set +e
          out=$(python -m pdoom.setup_db --sql-dir ../databricks/sql 2>&1)
          code=$?
          echo "::notice title=setup_db exit=${code}::$(printf '%s' "$out" | tail -c 1800 | tr '\n' '|')"
          exit $code
      - name: Query them
        if: always()
        run: |
          q() { databricks api post /api/2.0/sql/statements --json "$(jq -nc --arg w "$WAREHOUSE" --arg s "$1" '{warehouse_id:$w,wait_timeout:"50s",statement:$s}')" | jq -c '{state:.status.state, err:.status.error.message, rows:.result.data_array}' | cut -c1-900; }
          echo "::notice title=tables::$(q 'SELECT table_name, table_type FROM workspace.information_schema.tables WHERE table_schema = '"'pdoom'"' ORDER BY 1')"
          echo "::notice title=view types::$(q 'DESCRIBE workspace.pdoom.doom_decisions')"
          echo "::notice title=sessions view::$(q 'SELECT player_type, engine, outcome, count(*) FROM workspace.pdoom.doom_sessions GROUP BY ALL')"
          echo "::notice title=leaderboard::$(q 'SELECT player_type, engine, attempts, deaths, p_doom FROM workspace.pdoom.doom_leaderboard')"
          echo "::notice title=metric view::$(q 'SELECT player_type, MEASURE(attempts), MEASURE(p_doom) FROM workspace.pdoom.doom_metrics GROUP BY ALL')"
          echo "::notice title=decisions::$(q 'SELECT player_type, count(*), max(ts) FROM workspace.pdoom.doom_decisions GROUP BY ALL')"
