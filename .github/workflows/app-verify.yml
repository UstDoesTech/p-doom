# Checks the deployed Databricks App: HTTP, then a real Doom session in a browser, then the rows
# in Unity Catalog. Callable from app.yml or run on its own.
name: app-verify
on:
  workflow_call:
    inputs:
      catalog: { type: string, default: workspace }
      schema: { type: string, default: pdoom }
      warehouse_id: { type: string, default: 4f084f656bc73157 }
      app_name: { type: string, default: pdoom }
  workflow_dispatch:
    inputs:
      catalog: { default: workspace }
      schema: { default: pdoom }
      warehouse_id: { default: 4f084f656bc73157 }
      app_name: { default: pdoom }

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      CATALOG: ${{ inputs.catalog || 'workspace' }}
      SCHEMA: ${{ inputs.schema || 'pdoom' }}
      WAREHOUSE: ${{ inputs.warehouse_id || '4f084f656bc73157' }}
      APP_NAME: ${{ inputs.app_name || 'pdoom' }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Get a token for the app
        run: |
          host="${DATABRICKS_HOST%/}"
          resp=$(curl -s -u "$DATABRICKS_CLIENT_ID:$DATABRICKS_CLIENT_SECRET" -d grant_type=client_credentials -d scope=all-apis "$host/oidc/v1/token")
          tok=$(printf '%s' "$resp" | jq -r '.access_token // empty')
          [ -n "$tok" ] || { echo "::error title=token::$(printf '%s' "$resp" | jq -c 'del(.access_token)' | cut -c1-300)"; exit 1; }
          echo "::add-mask::$tok"
          echo "$tok" > "$RUNNER_TEMP/tok"
          databricks apps get "$APP_NAME" -o json | jq -r .url > "$RUNNER_TEMP/url"
          echo "::notice title=token::ok, $(printf '%s' "$resp" | jq -c '{token_type, expires_in, scope}')"
      - name: Check the deployed app over HTTP
        run: |
          url=$(cat "$RUNNER_TEMP/url"); tok=$(cat "$RUNNER_TEMP/tok")
          res=""
          for p in /api/health /api/players /doom/websockets-doom.wasm /doom/doom1.wad /; do
            line=$(curl -s -o "$RUNNER_TEMP/body" -D "$RUNNER_TEMP/hdr" -w '%{http_code} %{size_download}' -H "Authorization: Bearer $tok" "$url$p")
            res="$res $p=$line"
            [ "$p" = "/" ] && cp "$RUNNER_TEMP/hdr" "$RUNNER_TEMP/hdr_root"
          done
          echo "::notice title=http checks::${res}"
          echo "::notice title=response headers::$(tr -d '\r' < "$RUNNER_TEMP/hdr_root" | tr '\n' '|' | cut -c1-900)"
          echo "::notice title=health body::$(curl -s -H "Authorization: Bearer $tok" "$url/api/health" | head -c 400)"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Play a session in the deployed app
        run: |
          mkdir -p "$RUNNER_TEMP/v" && cp scripts/verify_app.mjs "$RUNNER_TEMP/v/"
          cd "$RUNNER_TEMP/v" && npm init -y >/dev/null && npm i --silent playwright@1.49.1
          npx playwright install --with-deps chromium >/dev/null
          set +e
          out=$(timeout 290 node verify_app.mjs "$(cat $RUNNER_TEMP/url)" "$(cat $RUNNER_TEMP/tok)" 2>&1)
          code=$?
          echo "::notice title=browser session exit=${code}::$(printf '%s' "$out" | tail -c 3500 | tr '\n' ' ')"
      - name: Play the other players and a stopped game (mock arena)
        run: |
          cd "$RUNNER_TEMP/v"
          set +e
          for spec in "ai_decide mock 6" "tool_agent mock 6" "supervisor mock 6" "vision_llm mock 6" "rule_bot mock 60 3000"; do
            out=$(timeout 240 node verify_app.mjs "$(cat $RUNNER_TEMP/url)" "$(cat $RUNNER_TEMP/tok)" $spec 2>&1)
            echo "::notice title=session $spec exit=$?::$(printf '%s' "$out" | tail -c 900 | tr '\n' ' ')"
          done
      - name: Did the session reach Databricks
        run: |
          q=$(databricks api post /api/2.0/sql/statements --json "$(jq -nc --arg w "$WAREHOUSE" --arg s "SELECT player_type, engine, outcome, started_at FROM $CATALOG.$SCHEMA.doom_sessions ORDER BY started_at DESC LIMIT 5" '{warehouse_id:$w,wait_timeout:"50s",statement:$s}')" | jq -c '{state:.status.state, err:.status.error.message, rows:.result.data_array}')
          echo "::notice title=latest sessions::${q}"
      - name: App logs from the session
        if: always()
        run: |
          logs=$(databricks apps logs "$APP_NAME" --tail-lines 400 2>&1 | grep "\[APP\]" | grep -vE "GET |POST .* 20[0-9]" | tail -30 | cut -c1-400 | tr '\n' '|')
          echo "::notice title=app log errors::${logs}"
      - name: Did the session reach Lakebase
        if: always()
        run: |
          set +e
          out=$(scripts/pg.sh -At -F' | ' -c "select s.session_id, s.player_type, s.engine, s.outcome, (select count(*) from pdoom.doom_events e where e.session_id=s.session_id) as events, (select count(*) from pdoom.doom_decisions d where d.session_id=s.session_id) as decisions from pdoom.doom_sessions s order by s.started_at desc limit 3" 2>&1 | grep -v '^::add-mask')
          echo "::notice title=lakebase latest sessions::${out:-none}"
          tot=$(scripts/pg.sh -At -c "select (select count(*) from pdoom.doom_sessions)||' sessions, '||(select count(*) from pdoom.doom_events)||' events, '||(select count(*) from pdoom.doom_decisions)||' decisions'" 2>&1 | grep -v '^::add-mask')
          echo "::notice title=lakebase totals::${tot}"

      - name: Decision health and transports per player
        if: always()
        run: |
          set +e
          out=$(scripts/pg.sh -At -F' | ' -c "select s.player_type, s.engine, coalesce(s.outcome,'(open)'), s.decisions, s.decision_errors, s.decision_timeouts, (select string_agg(distinct coalesce(d.raw_output->>'transport', d.raw_output->>'routed_to', '-'), ',') from pdoom.doom_decisions d where d.session_id=s.session_id) as paths, (select left(max(d.error),80) from pdoom.doom_decisions d where d.session_id=s.session_id) as last_error from pdoom.doom_sessions s order by s.started_at desc limit 8" 2>&1 | grep -v '^::add-mask')
          echo "::notice title=session health (player, engine, outcome, decisions, errors, timeouts, paths, error)::${out:-none}"
      - name: The views see the new columns and exclusions
        if: always()
        run: |
          q() { databricks api post /api/2.0/sql/statements --json "$(jq -nc --arg w "$WAREHOUSE" --arg s "$1" '{warehouse_id:$w,wait_timeout:"50s",statement:$s}')" | jq -c '{state:.status.state, err:.status.error.message, rows:.result.data_array}' | cut -c1-1200; }
          echo "::notice title=doom_games::$(q "SELECT player_type, engine, status, counts_as_attempt, decisions, decision_errors, decision_timeouts FROM $CATALOG.$SCHEMA.doom_games ORDER BY started_at DESC LIMIT 8")"
          echo "::notice title=leaderboard::$(q "SELECT player_type, engine, attempts, deaths, excluded_games FROM $CATALOG.$SCHEMA.doom_leaderboard ORDER BY engine, player_type")"
          echo "::notice title=metric view::$(q "SELECT player_type, MEASURE(attempts), MEASURE(games_started), MEASURE(aborted), MEASURE(abandoned), MEASURE(lost), MEASURE(unreliable) FROM $CATALOG.$SCHEMA.doom_metrics WHERE engine = 'mock' GROUP BY player_type")"
