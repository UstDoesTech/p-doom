# Untested. Needs an Azure app registration with a federated credential for this repo, and the
# repo variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, ACR_NAME, RESOURCE_GROUP.
name: deploy
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr build -r "${{ vars.ACR_NAME }}" -t pdoom:${{ github.sha }} .
      - run: >
          az containerapp update -n pdoom-app -g "${{ vars.RESOURCE_GROUP }}"
          --image "${{ vars.ACR_NAME }}.azurecr.io/pdoom:${{ github.sha }}"
