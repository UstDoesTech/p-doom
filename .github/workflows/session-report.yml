# Prints a short report on one session from Lakebase: the session row, how it ended, the last
# samples and decisions, and which intents the player chose. Results are annotations.
# Needs the DATABRICKS_* secrets. Input: the start of the session id.
name: session-report
on:
  workflow_dispatch:
    inputs:
      session:
        description: Start of the session id
        required: true
      last:
        description: How many final samples and decisions to show
        default: "25"
  push:
    branches: [feat/session-report]
    paths: [.github/workflows/session-report.yml]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      SESSION: ${{ inputs.session || 'c276eef0' }}
      LAST: ${{ inputs.last || '25' }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Report
        run: |
          set +e
          case "$SESSION" in *[!0-9a-fA-F-]*) echo "::error::session must be hex"; exit 1;; esac
          case "$LAST" in *[!0-9]*) echo "::error::last must be a number"; exit 1;; esac
          q() { scripts/pg.sh -At -F ' | ' -c "$2" 2>&1 | grep -v '^::add-mask::' | tr '\n' '¶' | cut -c1-3500 | sed "s/^/::notice title=$1::/"; echo; }
          W="session_id like '${SESSION}%'"
          q session "select session_id, player_type, mode, engine, level, seed, outcome, round(duration_s::numeric,1), kills, decisions, decision_errors, decision_timeouts, started_at from pdoom.doom_sessions where $W"
          q last_samples "select tic, health, armor, weapon, ammo, round(x::numeric), round(y::numeric), round(angle::numeric), action from (select * from pdoom.doom_events where $W order by tic desc limit $LAST) t order by tic"
          q last_decisions "select tic, intent, latency_ms, coalesce(raw_output->>'rule', raw_output->'assist'->>'note', ''), coalesce(raw_output->'assist'->'unstick'->>'step',''), left(coalesce(error,''),60) from (select * from pdoom.doom_decisions where $W order by tic desc limit $LAST) t order by tic"
          q intents "select intent, count(*), count(*) filter (where raw_output->'assist'->'unstick' is not null) as unstick from pdoom.doom_decisions where $W group by 1 order by 2 desc"
          q path "select (tic/525)*15 as sec, min(health), round(avg(x)::numeric), round(avg(y)::numeric), round(min(x)::numeric)||'..'||round(max(x)::numeric) as xr, round(min(y)::numeric)||'..'||round(max(y)::numeric) as yr, count(*) from pdoom.doom_events where $W group by 1 order by 1"
          q totals "select count(*), min(tic), max(tic), min(health), max(health) from pdoom.doom_events where $W"
